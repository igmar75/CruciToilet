<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CRUCIBATTLE!</title>
    
    <!-- Favicon e Icona WebApp (SVG compatto incorporato) -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Cdefs%3E%3ClinearGradient id='bg' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%234f46e5'/%3E%3Cstop offset='100%25' stop-color='%23312e81'/%3E%3C/linearGradient%3E%3Cfilter id='shadow' x='-20%25' y='-20%25' width='140%25' height='140%25'%3E%3CfeDropShadow dx='0' dy='10' stdDeviation='10' flood-opacity='0.4'/%3E%3C/filter%3E%3C/defs%3E%3Crect width='512' height='512' rx='128' fill='url(%23bg)'/%3E%3Cpath d='M256 64 l48 136 h144 l-116 88 44 140 -120 -88 -120 88 44 -140 -116 -88 h144 z' fill='%23facc15' stroke='%23ca8a04' stroke-width='12' stroke-linejoin='round' filter='url(%23shadow)'/%3E%3Ctext x='256' y='325' font-family='Arial, Helvetica, sans-serif' font-weight='900' font-size='140' fill='%231e3a8a' text-anchor='middle'%3EC%3C/text%3E%3C/svg%3E">
    <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Cdefs%3E%3ClinearGradient id='bg' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%234f46e5'/%3E%3Cstop offset='100%25' stop-color='%23312e81'/%3E%3C/linearGradient%3E%3Cfilter id='shadow' x='-20%25' y='-20%25' width='140%25' height='140%25'%3E%3CfeDropShadow dx='0' dy='10' stdDeviation='10' flood-opacity='0.4'/%3E%3C/filter%3E%3C/defs%3E%3Crect width='512' height='512' rx='128' fill='url(%23bg)'/%3E%3Cpath d='M256 64 l48 136 h144 l-116 88 44 140 -120 -88 -120 88 44 -140 -116 -88 h144 z' fill='%23facc15' stroke='%23ca8a04' stroke-width='12' stroke-linejoin='round' filter='url(%23shadow)'/%3E%3Ctext x='256' y='325' font-family='Arial, Helvetica, sans-serif' font-weight='900' font-size='140' fill='%231e3a8a' text-anchor='middle'%3EC%3C/text%3E%3C/svg%3E">
    <meta name="theme-color" content="#4f46e5">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="CRUCIBATTLE!">

    <!-- Tailwind CSS per lo styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React e ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel per compilare il JSX nel browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        @keyframes shake {
            0%, 100% { transform: rotate(0deg) translateX(0); }
            25% { transform: rotate(-5deg) translateX(-5px); }
            75% { transform: rotate(5deg) translateX(5px); }
        }
        .animate-shake { animation: shake 0.15s ease-in-out infinite; }
        
        .animate-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        .zoom-in { animation: zoomIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); }
        @keyframes zoomIn { from { transform: scale(0.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        body { 
            overscroll-behavior: none; 
            -webkit-tap-highlight-color: transparent;
            background-color: #f0f4ff;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script>
        Babel.registerPreset('react-classic', {
            presets: [
                [Babel.availablePresets.react, { runtime: 'classic' }]
            ]
        });
    </script>

    <script type="text/babel" data-presets="env,react-classic">
        // ==========================================
        //         CONFIGURAZIONE PRINCIPALE
        // ==========================================
        const DEBUG_MODE = true;         // Imposta a true per abilitare il pannello di debug e test rapidi
        const VERSION = "Ver 2.0";        // Versione visualizzata nel menu di gioco
        const GRID_SIZE = 8;             // Dimensione della griglia del crucipuzzle (8x8)
        
        // --- Parametri Premi Video ---
        const BASE_REWARD_PROBABILITY = 5; // Probabilità base (%) di ottenere il forziere a ogni parola (0-100)
        const REWARD_VIDEOS = [
            { file: "skibidi_toilet_web.mp4", weight: 50 },
            { file: "skibidi_toilet_gigante_web.mp4", weight: 50 }
        ];

        // --- Parametri Boss Fight ---
        const BOSS_WORDS_INTERVAL = 5;    // Ogni quante parole completate parte la Boss Fight
        const BOSS_MAX_HP = 3;            // Punti vita del boss (3 o 5 pallini)
        const BOSS_TIME_LIMIT = 30;       // Secondi a disposizione per sconfiggere il boss
        
        // Liste componibili del boss: la testa viene mostrata DAVANTI alla tazza
        const BOSS_TOILETS = [
            "toilet1.png",
            "toilet2.png",
            "toilet3.png"
        ];
        const BOSS_HEADS = [
            "head1.png",
            "head2.png"
        ];

        // --- Parametri Dimensionali e Posizionamento Boss (in pixel) ---
        const BOSS_CONTAINER_SIZE = 640;   // Dimensione del riquadro contenitore del boss
        const BOSS_TOILET_WIDTH = 520;     // Larghezza della tazza / toilet
        const BOSS_TOILET_HEIGHT = 520;    // Altezza della tazza / toilet
        const BOSS_HEAD_WIDTH = 360;       // Larghezza della testa
        const BOSS_HEAD_HEIGHT = 360;      // Altezza della testa
        const BOSS_HEAD_OFFSET_TOP = 0;    // Spostamento verticale della testa (valori positivi la abbassano, negativi la alzano)

        const AUDIO_CONFIG = {
            bgMusicVolume: 0.3,
            bgMusicVolumeDucked: 0.1,
            toneVolume: 0.4,
            rewardToneVolume: 0.05,
            speechVolume: 1.0,
            speechRate: 0.7,
            victoryVolume: 0.5,
            videoVolume: 0.8,
            bossMusicVolume: 0.35,
            bossSfxVolume: 0.6
        };

        const FALLBACK_WORDS = [
            "MAMMA", "PAPA", "NONNO", "NONNA", "CANE", "GATTO", "SOLE", "MARE", 
            "CASA", "PALLA", "LIBRO", "FIORE", "PANE", "LATTE", "MELA", "NIDO",
            "RANA", "LUNA", "LUCE", "ORSO", "UVA", "VINO", "ERBA", "TRENO",
            "FRUTTA", "SCUOLA", "GIOCO"
        ];

        const { useState, useEffect, useCallback, useRef } = React;

        const Icon = ({ name, size = 24, className = "", fill = "none" }) => {
            const containerRef = useRef(null);
            useEffect(() => {
                if (containerRef.current) {
                    containerRef.current.innerHTML = `<i data-lucide="${name}" style="width:${size}px; height:${size}px; display:inline-block;" class="${className}"></i>`;
                    if (window.lucide) {
                        window.lucide.createIcons({ root: containerRef.current });
                    }
                }
            }, [name, size, className]);

            return <span ref={containerRef} className="inline-flex items-center justify-center pointer-events-none select-none"></span>;
        };

        const App = () => {
            const [words, setWords] = useState([]);
            const [loading, setLoading] = useState(true);
            const [currentWord, setCurrentWord] = useState('');
            const [grid, setGrid] = useState([]);
            const [isUppercase, setIsUppercase] = useState(true);
            const [found, setFound] = useState(false);
            const [gameStarted, setGameStarted] = useState(false);
            const [correctCoords, setCorrectCoords] = useState([]);
            const [feedbackMap, setFeedbackMap] = useState({}); 
            const [foundCount, setFoundCount] = useState(0);
            const [totalSolved, setTotalSolved] = useState(0);
            
            // Stato Forziere & Video
            const [showReward, setShowReward] = useState(false);
            const [chestState, setChestState] = useState('closed'); // 'closed', 'shaking', 'ready_to_open', 'open'
            const [selectedVideo, setSelectedVideo] = useState('');

            // Stato Boss Fight
            const [isBossFight, setIsBossFight] = useState(false);
            const [bossHp, setBossHp] = useState(BOSS_MAX_HP);
            const [bossTimer, setBossTimer] = useState(BOSS_TIME_LIMIT);
            const [bossCurrentWord, setBossCurrentWord] = useState('');
            const [bossOptions, setBossOptions] = useState([]);
            const [bossEffect, setBossEffect] = useState(null); // 'hit', 'miss', null
            const [currentBossToilet, setCurrentBossToilet] = useState('');
            const [currentBossHead, setCurrentBossHead] = useState('');
            
            // Debugging
            const [debugLogs, setDebugLogs] = useState([]);
            const [isConsoleOpen, setIsConsoleOpen] = useState(false);

            // Riferimenti audio, timer e stato sincronizzato anti-race-condition
            const speechIntervalRef = useRef(null);
            const audioCtxRef = useRef(null);
            const bgMusicRef = useRef(null);
            const bossMusicRef = useRef(null);
            const bossTimerRef = useRef(null);
            const videoRef = useRef(null);

            // Ref per evitare race condition sui clic rapidi di Elia
            const foundCountRef = useRef(0);
            const feedbackMapRef = useRef({});
            const correctCoordsRef = useRef([]);

            const addLog = useCallback((msg, type = "info") => {
                const timestamp = new Date().toLocaleTimeString();
                setDebugLogs(prev => [{ timestamp, msg, type }, ...prev].slice(0, 100));
                console.log(`[GameDebug] [${type.toUpperCase()}] ${msg}`);
            }, []);

            useEffect(() => {
                const handleError = (event) => {
                    addLog(`Errore di runtime: ${event.message} in ${event.filename}:${event.lineno}`, "error");
                };
                window.addEventListener('error', handleError);
                return () => window.removeEventListener('error', handleError);
            }, [addLog]);

            useEffect(() => {
                bgMusicRef.current = new Audio('audio/background_music.mp3');
                bgMusicRef.current.loop = true;
                bgMusicRef.current.volume = AUDIO_CONFIG.bgMusicVolume;

                bossMusicRef.current = new Audio('audio/boss_music.mp3');
                bossMusicRef.current.loop = true;
                bossMusicRef.current.volume = AUDIO_CONFIG.bossMusicVolume;

                return () => {
                    if (bgMusicRef.current) { bgMusicRef.current.pause(); bgMusicRef.current = null; }
                    if (bossMusicRef.current) { bossMusicRef.current.pause(); bossMusicRef.current = null; }
                };
            }, []);

            useEffect(() => {
                const loadWords = async () => {
                    try {
                        const response = await fetch('assets/words.txt');
                        if (!response.ok) throw new Error(`HTTP ${response.status}`);
                        const text = await response.text();
                        const list = text.split(/\r?\n/)
                            .map(w => w.trim().toUpperCase())
                            .filter(w => w.length >= 3 && w.length <= GRID_SIZE);
                        
                        if (list.length > 0) {
                            setWords(list);
                        } else {
                            throw new Error("Nessuna parola idonea nel file txt.");
                        }
                    } catch (err) {
                        setWords(FALLBACK_WORDS);
                    } finally {
                        setLoading(false);
                    }
                };
                loadWords();
            }, []);

            useEffect(() => {
                if (videoRef.current && showReward && chestState === 'open' && selectedVideo) {
                    addLog(`Inizializzazione riproduzione video: ${selectedVideo}`);
                    videoRef.current.volume = AUDIO_CONFIG.videoVolume;
                    try {
                        videoRef.current.load();
                        const playPromise = videoRef.current.play();
                        if (playPromise !== undefined) {
                            playPromise
                                .then(() => addLog("Riproduzione video avviata con successo.", "success"))
                                .catch(error => {
                                    addLog(`Play bloccato: ${error.message}. Tento riproduzione muta...`, "warning");
                                    if (videoRef.current) {
                                        videoRef.current.muted = true;
                                        videoRef.current.play().catch(e => addLog(`Fallimento play: ${e.message}`, "error"));
                                    }
                                });
                        }
                    } catch (e) {
                        addLog(`Errore setup video: ${e.message}`, "error");
                    }
                }
            }, [showReward, chestState, selectedVideo, addLog]);

            const playTone = (freq, type = 'sine', duration = 0.1, volume = AUDIO_CONFIG.toneVolume) => {
                try {
                    if (!audioCtxRef.current) {
                        audioCtxRef.current = new (window.AudioContext || window.webkitAudioContext)();
                    }
                    const ctx = audioCtxRef.current;
                    if (ctx.state === 'suspended') ctx.resume();
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, ctx.currentTime);
                    gain.gain.setValueAtTime(volume, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + duration);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + duration);
                } catch (e) {}
            };

            const playRewardSound = () => {
                const tones = [523.25, 659.25, 783.99, 1046.50];
                tones.forEach((t, i) => {
                    setTimeout(() => playTone(t, 'square', 0.4, AUDIO_CONFIG.rewardToneVolume), i * 150);
                });
            };

            const initGame = useCallback((forceNextCase = null) => {
                if (words.length === 0) return;
                const nextCase = forceNextCase !== null ? forceNextCase : !isUppercase;
                setIsUppercase(nextCase);
                const word = words[Math.floor(Math.random() * words.length)];
                const displayWord = nextCase ? word.toUpperCase() : word.toLowerCase();
                setCurrentWord(displayWord);
                setFound(false);
                setFoundCount(0);
                setFeedbackMap({});

                // Reset immediato dei riferimenti sincroni
                foundCountRef.current = 0;
                feedbackMapRef.current = {};
                
                let newGrid = Array(GRID_SIZE).fill(null).map(() => 
                    Array(GRID_SIZE).fill(null).map(() => {
                        const charCode = Math.floor(Math.random() * 26) + (nextCase ? 65 : 97);
                        return String.fromCharCode(charCode);
                    })
                );

                const row = Math.floor(Math.random() * GRID_SIZE);
                const startCol = Math.floor(Math.random() * (GRID_SIZE - word.length + 1));
                const coords = [];
                for (let i = 0; i < word.length; i++) {
                    newGrid[row][startCol + i] = displayWord[i];
                    coords.push(`${row}-${startCol + i}`);
                }
                setGrid(newGrid);
                setCorrectCoords(coords);
                correctCoordsRef.current = coords;
            }, [isUppercase, words]);

            const speakWord = useCallback((wordToSpeak = null) => {
                const target = wordToSpeak || (isBossFight ? bossCurrentWord : currentWord);
                if (!target) return;
                try {
                    window.speechSynthesis.cancel();
                    const utterance = new SpeechSynthesisUtterance(target.toLowerCase());
                    utterance.lang = 'it-IT';
                    utterance.rate = AUDIO_CONFIG.speechRate; 
                    utterance.volume = AUDIO_CONFIG.speechVolume;
                    window.speechSynthesis.speak(utterance);
                } catch (e) {
                    addLog(`Errore sintesi vocale: ${e.message}`, "warning");
                }
            }, [currentWord, bossCurrentWord, isBossFight, addLog]);

            // Ciclo di lettura vocale per il gioco standard
            useEffect(() => {
                if (gameStarted && !found && !showReward && !isBossFight && currentWord) {
                    speakWord(currentWord);
                    speechIntervalRef.current = setInterval(() => speakWord(currentWord), 4000);
                } else if (!isBossFight) {
                    clearInterval(speechIntervalRef.current);
                }
                return () => {
                    if (!isBossFight) clearInterval(speechIntervalRef.current);
                };
            }, [gameStarted, found, currentWord, speakWord, showReward, isBossFight]);

            // Ciclo di lettura vocale dedicato alla Boss Fight
            useEffect(() => {
                if (gameStarted && isBossFight && bossHp > 0 && bossEffect === null && bossCurrentWord) {
                    const initialSpeakTimer = setTimeout(() => {
                        speakWord(bossCurrentWord);
                    }, 250);
                    const bossSpeechInterval = setInterval(() => {
                        speakWord(bossCurrentWord);
                    }, 4000);
                    return () => {
                        clearTimeout(initialSpeakTimer);
                        clearInterval(bossSpeechInterval);
                    };
                }
            }, [gameStarted, isBossFight, bossHp, bossEffect, bossCurrentWord, speakWord]);

            const setupBossQuestion = useCallback(() => {
                const wordPool = (words && words.length >= 3) ? words : FALLBACK_WORDS;
                const correct = wordPool[Math.floor(Math.random() * wordPool.length)];
                setBossCurrentWord(correct);
                addLog(`Parola Boss selezionata: ${correct}`);

                const distractors = [];
                let attempts = 0;
                while (distractors.length < 2 && attempts < 50) {
                    attempts++;
                    const candidate = wordPool[Math.floor(Math.random() * wordPool.length)];
                    if (candidate !== correct && !distractors.includes(candidate)) {
                        distractors.push(candidate);
                    }
                }
                if (distractors.length < 2) {
                    const extra = ["CANE", "GATTO", "SOLE", "LUNA", "MARE"];
                    for (const w of extra) {
                        if (w !== correct && !distractors.includes(w)) {
                            distractors.push(w);
                            if (distractors.length === 2) break;
                        }
                    }
                }

                const options = [correct, ...distractors].sort(() => Math.random() - 0.5);
                setBossOptions(options);
            }, [words, addLog]);

            const startBossFight = useCallback(() => {
                addLog("Avvio Boss Fight!", "warning");
                window.speechSynthesis.cancel();
                setGameStarted(true);
                setIsBossFight(true);
                setBossHp(BOSS_MAX_HP);
                setBossTimer(BOSS_TIME_LIMIT);
                setBossEffect(null);

                // Estrazione casuale tazza e testa componibili
                if (BOSS_TOILETS.length > 0) {
                    const randomToilet = BOSS_TOILETS[Math.floor(Math.random() * BOSS_TOILETS.length)];
                    setCurrentBossToilet(`assets/${randomToilet}`);
                }
                if (BOSS_HEADS.length > 0) {
                    const randomHead = BOSS_HEADS[Math.floor(Math.random() * BOSS_HEADS.length)];
                    setCurrentBossHead(`assets/${randomHead}`);
                }

                // Switch audio di sottofondo
                if (bgMusicRef.current) bgMusicRef.current.pause();
                if (bossMusicRef.current) {
                    bossMusicRef.current.currentTime = 0;
                    bossMusicRef.current.play().catch(e => addLog(`Musica boss non avviata: ${e.message}`, "warning"));
                }

                setupBossQuestion();
            }, [addLog, setupBossQuestion]);

            // Garanzia che bossOptions sia sempre popolato durante la Boss Fight
            useEffect(() => {
                if (isBossFight && bossOptions.length === 0) {
                    setupBossQuestion();
                }
            }, [isBossFight, bossOptions, setupBossQuestion]);

            // Timer del boss
            useEffect(() => {
                if (isBossFight && bossHp > 0) {
                    bossTimerRef.current = setInterval(() => {
                        setBossTimer(prev => {
                            if (prev <= 1) {
                                clearInterval(bossTimerRef.current);
                                endBossFight(false);
                                return 0;
                            }
                            return prev - 1;
                        });
                    }, 1000);
                } else {
                    clearInterval(bossTimerRef.current);
                }
                return () => clearInterval(bossTimerRef.current);
            }, [isBossFight, bossHp]);

            const endBossFight = (victory) => {
                clearInterval(bossTimerRef.current);
                window.speechSynthesis.cancel();
                if (bossMusicRef.current) {
                    bossMusicRef.current.pause();
                    bossMusicRef.current.currentTime = 0;
                }

                if (victory) {
                    addLog("Boss Sconfitto! +5 Stelle!", "success");
                    setTotalSolved(prev => prev + 5);
                    const winSound = new Audio('audio/super_victory.mp3');
                    winSound.volume = AUDIO_CONFIG.victoryVolume;
                    winSound.play().catch(() => {});
                } else {
                    addLog("Tempo scaduto contro il Boss!", "error");
                }

                setTimeout(() => {
                    setIsBossFight(false);
                    if (bgMusicRef.current) {
                        bgMusicRef.current.volume = AUDIO_CONFIG.bgMusicVolume;
                        bgMusicRef.current.play().catch(() => {});
                    }
                    initGame();
                }, 2200);
            };

            const handleBossOptionClick = (option) => {
                if (!isBossFight || bossEffect !== null || bossHp <= 0) return;

                if (option === bossCurrentWord) {
                    setBossEffect('hit');
                    try {
                        const hitAudio = new Audio('audio/boss_hit.mp3');
                        hitAudio.volume = AUDIO_CONFIG.bossSfxVolume;
                        hitAudio.play().catch(() => playTone(880, 'square', 0.25, AUDIO_CONFIG.toneVolume));
                    } catch (e) {
                        playTone(880, 'square', 0.25, AUDIO_CONFIG.toneVolume);
                    }

                    const nextHp = bossHp - 1;
                    setBossHp(nextHp);

                    setTimeout(() => {
                        setBossEffect(null);
                        if (nextHp <= 0) {
                            endBossFight(true);
                        } else {
                            setupBossQuestion();
                        }
                    }, 800);
                } else {
                    setBossEffect('miss');
                    try {
                        const missAudio = new Audio('audio/boss_miss.mp3');
                        missAudio.volume = AUDIO_CONFIG.bossSfxVolume;
                        missAudio.play().catch(() => playTone(160, 'sawtooth', 0.35, AUDIO_CONFIG.toneVolume));
                    } catch (e) {
                        playTone(160, 'sawtooth', 0.35, AUDIO_CONFIG.toneVolume);
                    }

                    setTimeout(() => {
                        setBossEffect(null);
                    }, 800);
                }
            };

            // ========================================================
            //   GESTIONE CLIC CELLE ROBUSTA CONTRO I CLIC ULTRA-RAPIDI
            // ========================================================
            const handleCellClick = (r, c) => {
                if (found || showReward || isBossFight) return;
                const id = `${r}-${c}`;
                
                // Se la lettera è GIÀ stata indovinata ed è verde, ignora qualsiasi tocco successivo
                if (feedbackMapRef.current[id] === 'correct') {
                    return;
                }

                const currentCount = foundCountRef.current;
                const coords = correctCoordsRef.current;
                const expectedId = coords[currentCount];

                if (id === expectedId) {
                    // --- CASO 1: Lettera corretta in rigoroso ordine sequenziale ---
                    playTone(660, 'sine', 0.15, AUDIO_CONFIG.toneVolume);
                    
                    const nextCount = currentCount + 1;
                    foundCountRef.current = nextCount;
                    setFoundCount(nextCount);

                    feedbackMapRef.current = { ...feedbackMapRef.current, [id]: 'correct' };
                    setFeedbackMap({ ...feedbackMapRef.current });

                    // La vittoria scatta SOLO se tutte le coordinate della parola sono ora verdi
                    const allCompleted = coords.length > 0 && coords.every(coordId => feedbackMapRef.current[coordId] === 'correct');

                    if (allCompleted) {
                        setFound(true);
                        const nextTotal = totalSolved + 1;
                        setTotalSolved(nextTotal);
                        addLog(`Parola completata! (${coords.length}/${coords.length} lettere) - Totale: ${nextTotal}`);

                        setTimeout(() => playTone(523, 'sine', 0.2, AUDIO_CONFIG.toneVolume), 100);
                        setTimeout(() => playTone(783, 'sine', 0.4, AUDIO_CONFIG.toneVolume), 300);

                        const victoryAudio = new Audio('audio/victory.mp3');
                        victoryAudio.volume = AUDIO_CONFIG.victoryVolume;
                        victoryAudio.play().catch(() => {});

                        setTimeout(() => {
                            // Verifica Boss Fight
                            if (nextTotal % BOSS_WORDS_INTERVAL === 0) {
                                startBossFight();
                                return;
                            }

                            // Verifica Premio Forziere basato su probabilità
                            const rewardRoll = Math.random() * 100;
                            if (rewardRoll < BASE_REWARD_PROBABILITY && REWARD_VIDEOS.length > 0) {
                                const totalWeight = REWARD_VIDEOS.reduce((acc, v) => acc + (v.weight || 1), 0);
                                let randomChoice = Math.random() * totalWeight;
                                let chosen = REWARD_VIDEOS[0].file;
                                for (const v of REWARD_VIDEOS) {
                                    if (randomChoice < (v.weight || 1)) {
                                        chosen = v.file;
                                        break;
                                    }
                                    randomChoice -= (v.weight || 1);
                                }
                                setSelectedVideo(encodeURI(`assets/${chosen}`));
                                setShowReward(true);
                                setChestState('closed');
                                if (bgMusicRef.current) bgMusicRef.current.volume = AUDIO_CONFIG.bgMusicVolumeDucked;
                            } else {
                                initGame();
                            }
                        }, 2500);
                    }
                } else if (coords.includes(id)) {
                    // --- CASO 2: Lettera appartiene alla parola ma è FUORI ORDINE ---
                    // Se non è già verde, lampeggia di giallo
                    playTone(330, 'triangle', 0.2, AUDIO_CONFIG.toneVolume);
                    
                    feedbackMapRef.current = { ...feedbackMapRef.current, [id]: 'wrong-order' };
                    setFeedbackMap({ ...feedbackMapRef.current });

                    setTimeout(() => {
                        // Rimuove il giallo SOLO se la cella nel frattempo non è diventata verde
                        if (feedbackMapRef.current[id] === 'wrong-order') {
                            const updated = { ...feedbackMapRef.current };
                            delete updated[id];
                            feedbackMapRef.current = updated;
                            setFeedbackMap(updated);
                        }
                    }, 500);
                } else {
                    // --- CASO 3: Lettera completamente errata (estranea alla parola) ---
                    playTone(150, 'triangle', 0.3, AUDIO_CONFIG.toneVolume);
                    
                    feedbackMapRef.current = { ...feedbackMapRef.current, [id]: 'wrong' };
                    setFeedbackMap({ ...feedbackMapRef.current });

                    setTimeout(() => {
                        if (feedbackMapRef.current[id] === 'wrong') {
                            const updated = { ...feedbackMapRef.current };
                            delete updated[id];
                            feedbackMapRef.current = updated;
                            setFeedbackMap(updated);
                        }
                    }, 500);
                }
            };

            const handleOpenChest = () => {
                if (chestState === 'closed') {
                    setChestState('shaking');
                    playTone(200, 'square', 0.5, AUDIO_CONFIG.toneVolume);
                    setTimeout(() => setChestState('ready_to_open'), 1000);
                }
            };

            const triggerVideoPlayback = () => {
                setChestState('open');
                playRewardSound();
                if (bgMusicRef.current) bgMusicRef.current.volume = 0;
            };

            const handleCloseReward = () => {
                setShowReward(false);
                setChestState('closed');
                setSelectedVideo('');
                if (bgMusicRef.current) bgMusicRef.current.volume = AUDIO_CONFIG.bgMusicVolume;
                initGame();
            };

            const handleStartGame = () => {
                setGameStarted(true);
                initGame(true);
                if (bgMusicRef.current) bgMusicRef.current.play().catch(() => {});
            };

            const handleExitGame = () => {
                window.speechSynthesis.cancel();
                if (speechIntervalRef.current) clearInterval(speechIntervalRef.current);
                if (bossTimerRef.current) clearInterval(bossTimerRef.current);
                if (bgMusicRef.current) { bgMusicRef.current.pause(); bgMusicRef.current.currentTime = 0; }
                if (bossMusicRef.current) { bossMusicRef.current.pause(); bossMusicRef.current.currentTime = 0; }
                setGameStarted(false);
                setShowReward(false);
                setIsBossFight(false);
                setFound(false);
            };

            return (
                <div className="relative min-h-screen flex flex-col justify-between pb-12 select-none overflow-x-hidden">
                    <div 
                        className="relative flex flex-col items-center flex-grow p-2 font-sans touch-none"
                        style={{ 
                            backgroundImage: isBossFight 
                                ? "url('assets/boss_background.jpg'), linear-gradient(to bottom, #1e1b4b, #0f172a)" 
                                : (gameStarted ? "url('assets/game_background.jpg')" : "url('assets/start_background.jpg')"),
                            backgroundSize: 'cover',
                            backgroundPosition: 'center',
                            backgroundRepeat: 'no-repeat',
                            minHeight: '100vh',
                            backgroundColor: isBossFight ? '#1e1b4b' : '#f0f4ff'
                        }}
                    >
                        {/* OVERLAY VIDEO PREMIO A TUTTO SCHERMO */}
                        {showReward && (
                            <div className="fixed inset-0 z-[100] flex flex-col items-center justify-center bg-indigo-900/95 p-4 animate-in">
                                {chestState === 'closed' || chestState === 'shaking' ? (
                                    <React.Fragment>
                                        <div className="text-yellow-400 text-4xl font-black mb-12 tracking-widest animate-bounce uppercase text-center">PREMIO SPECIALE!</div>
                                        <div onClick={handleOpenChest} className={`relative cursor-pointer transition-transform ${chestState === 'shaking' ? 'animate-shake' : 'hover:scale-105 active:scale-95'}`}>
                                            <div className="absolute -inset-8 bg-yellow-400/20 rounded-full blur-3xl animate-pulse"></div>
                                            <div className="bg-orange-600 w-48 h-40 rounded-xl border-t-8 border-orange-400 border-x-4 shadow-2xl flex items-center justify-center relative overflow-hidden">
                                                <div className="absolute top-1/2 w-full h-4 bg-orange-800"></div>
                                                <div className="w-12 h-12 bg-yellow-400 rounded-lg border-4 border-orange-800 z-10"></div>
                                            </div>
                                        </div>
                                        <div className="text-white/60 mt-12 font-bold text-xl animate-pulse uppercase tracking-widest text-center">Tocca il forziere!</div>
                                    </React.Fragment>
                                ) : chestState === 'ready_to_open' ? (
                                    <div className="flex flex-col items-center zoom-in text-center">
                                        <div className="text-yellow-400 text-4xl font-black mb-12 tracking-widest uppercase">IL FORZIERE È PRONTO!</div>
                                        <button 
                                            onClick={triggerVideoPlayback}
                                            className="bg-green-500 hover:bg-green-600 text-white px-10 py-6 rounded-3xl text-3xl font-black shadow-[0_8px_0_rgb(21,128,61)] active:translate-y-1 active:shadow-none transition-all uppercase tracking-wider animate-pulse"
                                        >
                                            Apri il regalo! 🎁
                                        </button>
                                    </div>
                                ) : selectedVideo ? (
                                    <div className="fixed inset-0 z-[200] bg-black flex flex-col items-center justify-center zoom-in">
                                        <video 
                                            key={selectedVideo}
                                            ref={videoRef}
                                            src={selectedVideo}
                                            autoPlay
                                            playsInline
                                            controls={false}
                                            onEnded={handleCloseReward}
                                            onError={() => setTimeout(handleCloseReward, 2500)}
                                            className="w-full h-full object-contain"
                                        />
                                        <button 
                                            onClick={handleCloseReward}
                                            className="absolute bottom-8 bg-yellow-400/90 hover:bg-yellow-400 text-indigo-900 px-10 py-4 rounded-2xl text-2xl font-black shadow-[0_5px_0_rgb(202,138,4)] active:translate-y-1 active:shadow-none transition-all uppercase z-10 border-2 border-yellow-200"
                                        >
                                            Avanti!
                                        </button>
                                    </div>
                                ) : (
                                    <div className="w-full max-w-lg flex flex-col items-center justify-center zoom-in">
                                        <div className="text-yellow-400 flex gap-4">
                                            <Icon name="star" size={80} fill="currentColor" className="animate-bounce" />
                                            <Icon name="star" size={100} fill="currentColor" className="animate-bounce" />
                                            <Icon name="star" size={80} fill="currentColor" className="animate-bounce" />
                                        </div>
                                        <button 
                                            onClick={handleCloseReward}
                                            className="mt-8 bg-yellow-400 text-indigo-900 px-10 py-4 rounded-2xl text-2xl font-black shadow-[0_5px_0_rgb(202,138,4)] active:translate-y-1 active:shadow-none transition-all uppercase"
                                        >
                                            Avanti!
                                        </button>
                                    </div>
                                )}
                            </div>
                        )}

                        {gameStarted && isBossFight ? (
                            <div 
                                className="fixed inset-0 z-40 flex flex-col justify-between items-center p-3 animate-in overflow-hidden select-none"
                                style={{ 
                                    backgroundImage: "url('assets/boss_background.jpg'), linear-gradient(to bottom, #1e1b4b, #0f172a)",
                                    backgroundSize: 'cover',
                                    backgroundPosition: 'center',
                                    backgroundColor: '#1e1b4b'
                                }}
                            >
                                {/* Header Boss: Punti Vita e Timer */}
                                <div className="w-full max-w-md bg-black/70 backdrop-blur-md rounded-2xl p-2.5 sm:p-3 border-2 border-red-500/40 shadow-xl flex items-center justify-between z-30 shrink-0">
                                    <div className="flex items-center gap-1.5">
                                        {Array.from({ length: BOSS_MAX_HP }).map((_, idx) => (
                                            <div 
                                                key={idx} 
                                                className={`w-6 h-6 rounded-full border-2 border-white transition-all duration-300 ${
                                                    idx < bossHp 
                                                        ? 'bg-red-500 shadow-[0_0_12px_rgba(239,68,68,0.8)] scale-100' 
                                                        : 'bg-zinc-700/80 scale-90 opacity-40'
                                                }`}
                                            />
                                        ))}
                                    </div>
                                    <div className="flex items-center gap-2 bg-red-950/80 px-3 py-1 rounded-xl border border-red-500/50">
                                        <Icon name="clock" size={20} className="text-yellow-400" />
                                        <span className={`font-black text-2xl ${bossTimer <= 5 ? 'text-red-400 animate-pulse' : 'text-white'}`}>
                                            {bossTimer}s
                                        </span>
                                    </div>
                                </div>

                                {/* Immagine del Boss Gigante: centrata nello schermo, z-20 */}
                                <div className="absolute inset-0 flex items-center justify-center pointer-events-none overflow-hidden z-20">
                                    <div 
                                        style={{ width: `${BOSS_CONTAINER_SIZE}px`, height: `${BOSS_CONTAINER_SIZE}px` }}
                                        className={`relative flex items-center justify-center transition-transform duration-200 pointer-events-auto ${bossEffect === 'hit' ? 'animate-shake brightness-125' : ''}`}
                                    >
                                        {(currentBossToilet || currentBossHead) ? (
                                            <div className="relative w-full h-full flex items-center justify-center">
                                                {/* Livello 1: Toilette (dietro - z-10) */}
                                                {currentBossToilet && (
                                                    <img 
                                                        src={currentBossToilet} 
                                                        alt="Toilette Boss"
                                                        onError={(e) => { e.currentTarget.style.display = 'none'; }}
                                                        style={{ 
                                                            width: `${BOSS_TOILET_WIDTH}px`, 
                                                            height: `${BOSS_TOILET_HEIGHT}px` 
                                                        }}
                                                        className="absolute bottom-12 object-contain z-10 drop-shadow-[0_12px_24px_rgba(0,0,0,0.8)] pointer-events-none select-none max-w-none"
                                                    />
                                                )}

                                                {/* Livello 2: Testa (davanti - z-20) */}
                                                {currentBossHead && (
                                                    <img 
                                                        src={currentBossHead} 
                                                        alt="Testa Boss"
                                                        onError={(e) => { e.currentTarget.style.display = 'none'; }}
                                                        style={{ 
                                                            width: `${BOSS_HEAD_WIDTH}px`, 
                                                            height: `${BOSS_HEAD_HEIGHT}px`,
                                                            top: `${BOSS_HEAD_OFFSET_TOP}px`
                                                        }}
                                                        className="absolute object-contain z-20 drop-shadow-[0_8px_16px_rgba(0,0,0,0.7)] pointer-events-none select-none animate-bounce [animation-duration:2.5s] max-w-none"
                                                    />
                                                )}
                                            </div>
                                        ) : (
                                            <div className="text-8xl select-none animate-bounce">👾</div>
                                        )}

                                        {/* Effetto Esplosione 💥 */}
                                        {bossEffect === 'hit' && (
                                            <div className="absolute inset-0 flex items-center justify-center z-30 pointer-events-none zoom-in">
                                                <span className="text-8xl">💥</span>
                                            </div>
                                        )}

                                        {/* Effetto Mancato ❌ */}
                                        {bossEffect === 'miss' && (
                                            <div className="absolute inset-0 flex items-center justify-center z-30 pointer-events-none zoom-in">
                                                <span className="text-8xl">❌</span>
                                            </div>
                                        )}
                                    </div>
                                </div>

                                {/* Scelte Multiple: IN PRIMO PIANO (z-50) DAVANTI ALLA TAZZA */}
                                <div className="w-full max-w-md flex flex-col gap-2.5 z-50 shrink-0 pb-12 sm:pb-8 px-2">
                                    {bossOptions.length > 0 ? (
                                        bossOptions.map((opt, i) => (
                                            <button
                                                key={i}
                                                onClick={() => handleBossOptionClick(opt)}
                                                disabled={bossEffect !== null}
                                                className="w-full bg-white hover:bg-yellow-50 active:bg-yellow-100 text-indigo-950 py-3 sm:py-3.5 px-4 rounded-2xl font-black text-2xl sm:text-3xl shadow-[0_8px_25px_rgba(0,0,0,0.85)] border-2 border-indigo-300 border-b-6 border-b-indigo-600 active:translate-y-1 active:shadow-none transition-all tracking-wider uppercase text-center disabled:opacity-75 cursor-pointer select-none"
                                            >
                                                {opt}
                                            </button>
                                        ))
                                    ) : (
                                        <div className="text-white text-center font-bold animate-pulse">Caricamento opzioni...</div>
                                    )}
                                </div>
                            </div>
                        ) : gameStarted ? (
                            <div className="w-full max-w-md flex flex-col items-center flex-grow">
                                {/* Barra superiore: Stelle e stato */}
                                <div className="w-full flex items-center justify-between mb-2 px-2 bg-white/30 backdrop-blur-sm rounded-2xl p-2 border border-white/20 mt-2">
                                    <div className="flex items-center gap-1.5 bg-white px-3.5 py-1.5 rounded-xl shadow-sm border-b-2 border-indigo-100">
                                        <Icon name="star" size={22} className="text-yellow-500" fill="currentColor" />
                                        <span className="font-black text-indigo-900 text-xl">{totalSolved}</span>
                                    </div>
                                    <div className="flex items-center gap-1.5 bg-white/80 px-3 py-1 rounded-xl text-indigo-800 font-bold text-xs shadow-sm">
                                        <span>Prossimo Boss:</span>
                                        <span className="font-black text-red-600 text-sm">
                                            {BOSS_WORDS_INTERVAL - (totalSolved % BOSS_WORDS_INTERVAL)}
                                        </span>
                                    </div>
                                </div>

                                {/* Parola da trovare */}
                                <div className="w-full bg-white/90 backdrop-blur-sm rounded-2xl shadow-lg p-4 mb-3 text-center border-b-4 border-indigo-200">
                                    <div className="text-indigo-400 uppercase text-[11px] font-black tracking-widest mb-1">Cerca questa parola:</div>
                                    <div className={`text-5xl font-black tracking-tight ${found ? 'text-green-500 scale-110' : 'text-indigo-900'} transition-all`}>
                                        {currentWord}
                                    </div>
                                </div>

                                {/* Griglia di gioco */}
                                <div 
                                    className="grid gap-1.5 p-2 bg-white/80 backdrop-blur-sm rounded-2xl shadow-xl border-4 border-white w-full max-w-[450px] aspect-square" 
                                    style={{ gridTemplateColumns: `repeat(${GRID_SIZE}, 1fr)` }}
                                >
                                    {grid.map((row, r) => row.map((char, c) => {
                                        const id = `${r}-${c}`;
                                        const status = feedbackMap[id];
                                        let cellClass = "bg-white text-indigo-800 border-indigo-100";
                                        if (status === 'correct') cellClass = "bg-green-500 text-white shadow-inner scale-95 border-green-600";
                                        if (status === 'wrong-order') cellClass = "bg-yellow-400 text-indigo-900 animate-shake border-yellow-500";
                                        if (status === 'wrong') cellClass = "bg-red-500 text-white animate-shake border-red-600";
                                        
                                        return (
                                            <button 
                                                key={id} 
                                                onClick={() => handleCellClick(r, c)} 
                                                className={`flex items-center justify-center text-2xl sm:text-3xl font-black rounded-lg transition-all duration-200 aspect-square border-b-2 ${cellClass} ${!status ? 'hover:bg-indigo-50 active:bg-indigo-200' : ''}`}
                                            >
                                                {char}
                                            </button>
                                        );
                                    }))}
                                </div>

                                {/* Messaggio di vittoria parola */}
                                <div className="mt-3 h-12 flex items-center justify-center">
                                    {found && (
                                        <div className="flex items-center gap-2 text-green-600 bg-white/90 backdrop-blur-md px-6 py-2 rounded-full font-black text-2xl shadow-lg border-b-4 border-green-200 animate-bounce">
                                            <Icon name="check-circle-2" size={30} className="stroke-[3]" /> BRAVO!
                                        </div>
                                    )}
                                </div>

                                {/* Pulsante Esci sollevato da terra per non sovrapporsi ai tasti di sistema */}
                                <button 
                                    onClick={handleExitGame}
                                    className="absolute bottom-12 right-4 bg-red-600 hover:bg-red-700 text-white p-3 rounded-2xl shadow-xl active:scale-90 z-50 border-b-4 border-red-800 transition-transform"
                                    title="Esci al menu"
                                >
                                    <Icon name="x" size={24} />
                                </button>
                            </div>
                        ) : (
                            <div className="flex flex-col items-center justify-center flex-grow text-center">
                                <div className="bg-white/95 backdrop-blur-sm p-8 rounded-3xl shadow-2xl max-w-sm border-b-8 border-indigo-200">
                                    <div className="flex justify-center mb-4 text-yellow-400">
                                        <Icon name="star" size={56} fill="currentColor" />
                                    </div>
                                    <h1 className="text-4xl font-black text-indigo-900 mb-2 tracking-tight uppercase">CRUCIBATTLE!</h1>
                                    <p className="text-lg text-indigo-600 mb-0.5 font-medium italic">Il gioco delle super parole</p>
                                    <p className="text-xs text-indigo-400 mb-8 font-normal italic">{VERSION}</p>
                                    <button 
                                        onClick={handleStartGame} 
                                        className="w-full bg-yellow-400 hover:bg-yellow-300 text-indigo-900 px-8 py-5 rounded-2xl text-3xl font-black shadow-[0_6px_0_rgb(202,138,4)] active:translate-y-1 active:shadow-none transition-all tracking-tight uppercase"
                                    >
                                        Gioca!
                                    </button>
                                </div>
                            </div>
                        )}
                    </div>

                    {/* PANNELLO DI DEBUG */}
                    {DEBUG_MODE && (
                        <div className="fixed bottom-0 left-0 right-0 z-[200] bg-zinc-900 text-zinc-300 font-mono text-xs border-t-4 border-red-500 shadow-2xl transition-all duration-300" style={{ height: isConsoleOpen ? '180px' : '30px' }}>
                            <div className="flex items-center justify-between bg-zinc-800 px-4 py-1 border-b border-zinc-700">
                                <span className="font-bold text-red-400 flex items-center gap-1">
                                    <span className="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
                                    DEBUGGER MOBILE
                                </span>
                                <div className="flex gap-2">
                                    <button onClick={startBossFight} className="bg-amber-600 hover:bg-amber-500 text-white px-2 py-0.5 rounded text-[10px] font-bold">
                                        Test Boss
                                    </button>
                                    <button onClick={() => setDebugLogs([])} className="bg-zinc-700 hover:bg-zinc-600 text-zinc-200 px-2 py-0.5 rounded text-[10px]">
                                        Pulisci
                                    </button>
                                    <button onClick={() => setIsConsoleOpen(!isConsoleOpen)} className="bg-zinc-700 text-white px-3 py-0.5 rounded font-bold">
                                        {isConsoleOpen ? 'Riduci' : 'Espandi'}
                                    </button>
                                </div>
                            </div>
                            {isConsoleOpen && (
                                <div className="p-2 overflow-y-auto h-[145px] flex flex-col-reverse gap-1 select-text">
                                    {debugLogs.length === 0 ? (
                                        <div className="text-zinc-500 italic">Nessun log registrato.</div>
                                    ) : (
                                        debugLogs.map((log, index) => (
                                            <div key={index} className={`border-b border-zinc-800/50 pb-0.5 leading-tight ${log.type === 'error' ? 'text-red-400 font-bold' : log.type === 'warning' ? 'text-yellow-400' : log.type === 'success' ? 'text-green-400 font-bold' : 'text-zinc-300'}`}>
                                                <span className="text-zinc-500 mr-2">[{log.timestamp}]</span>
                                                {log.msg}
                                            </div>
                                        ))
                                    )}
                                </div>
                            )}
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
