    <style>
        @keyframes shake {
            0%, 100% { transform: rotate(0deg) translateX(0); }
            25% { transform: rotate(-5deg) translateX(-5px); }
            75% { transform: rotate(5deg) translateX(5px); }
        }
        .animate-shake { animation: shake 0.15s ease-in-out infinite; }
        
        .animate-in { animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        .zoom-in { animation: zoomIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); }
        @keyframes zoomIn { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        @keyframes explosion {
            0% { transform: scale(0.3); opacity: 0; filter: brightness(2); }
            50% { transform: scale(1.3); opacity: 1; filter: brightness(1.5); }
            100% { transform: scale(1.5); opacity: 0; }
        }
        .animate-explosion { animation: explosion 0.7s ease-out forwards; }

        @keyframes smoke {
            0% { transform: scale(0.4) translateY(20px); opacity: 0; }
            40% { transform: scale(1.1) translateY(-10px); opacity: 0.9; }
            100% { transform: scale(1.4) translateY(-40px); opacity: 0; }
        }
        .animate-smoke { animation: smoke 0.8s ease-out forwards; }

        body { 
            overscroll-behavior: none; 
            -webkit-tap-highlight-color: transparent;
            background-color: #f0f4ff;
        }

    <div id="root"></div>

    <!-- Configurazione sicura di Babel per forzare il runtime classico senza errori -->
    <script>
        Babel.registerPreset('react-classic', {
            presets: [
                [Babel.availablePresets.react, { runtime: 'classic' }]
            ]
        });
    </script>

    <script type="text/babel" data-presets="env,react-classic">
        // ==========================================
        //         CONFIGURAZIONE DI BASE DEL GIOCO
        // ==========================================
        const DEBUG_MODE = false;         // Imposta a false per nascondere il pannello di debug
        const VERSION = "Ver 1.7";        // Versione del gioco
        const GRID_SIZE = 8;              // Dimensione della griglia del crucipuzzle (8x8)

        // ==========================================
        //         PARAMETRI DELLA MODALITÀ BOSS
        // ==========================================
        const BOSS_WORDS_INTERVAL = 5;    // Ogni quante parole scatta la Boss Fight (es. 5)
        const BOSS_MAX_HP = 3;            // Punti vita del Boss (es. 3 o 5)
        const BOSS_TIME_LIMIT = 30;       // Secondi massimi per sconfiggere il Boss

        // Probabilità base (in %) di ricevere il forziere a fine parola ordinaria (es. 25 = 25%)
        const BASE_REWARD_PROBABILITY = 25; 

        // ==========================================
        //         ELENCO DEI VIDEO PREMIO CON PESO/PROBABILITÀ
        // ==========================================
        const REWARD_VIDEOS = [
            { file: "skibidi_toilet_web.mp4", weight: 30 },
            { file: "skibidi_toilet_gigante_web.mp4", weight: 20 },
            { file: "Skibidi_67.mp4", weight: 15 },
            { file: "Skibidi_CocaCola.mp4", weight: 15 },
            { file: "Skibidi_Elia.mp4", weight: 35 },
            { file: "Skibidi_Minecraft1.mp4", weight: 20 },
            { file: "Skibidi_Minecraft2.mp4", weight: 20 },
            { file: "skibidi toilet verity 3.mp4", weight: 10 }
        ];

        const AUDIO_CONFIG = {
            bgMusicVolume: 0.1,        // Volume normale musica di sottofondo (0.0 - 1.0)
            bossMusicVolume: 0.25,     // Volume musica Boss Fight (0.0 - 1.0)
            bgMusicVolumeDucked: 0.05, // Volume musica ridotto durante la schermata del forziere (0.0 - 1.0)
            toneVolume: 0.4,           // Volume suoni ed effetti standard (0.0 - 1.0)
            rewardToneVolume: 0.05,    // Volume melodia iniziale del forziere (0.0 - 1.0)
            speechVolume: 1.0,         // Volume voce che legge le parole (0.0 - 1.0)
            speechRate: 0.7,           // Velocità della voce (0.7 = scandita e rilassata)
            victoryVolume: 0.5,        // Volume MP3 di vittoria (0.0 - 1.0)
            videoVolume: 0.3,          // Volume video premio (0.0 - 1.0)
            bossHitVolume: 0.6,        // Volume colpo a segno sul boss (0.0 - 1.0)
            bossMissVolume: 0.5        // Volume errore sul boss (0.0 - 1.0)
        };

        const { useState, useEffect, useCallback, useRef } = React;
        
        const Icon = ({ name, size = 24, className = "", fill = "none" }) => {
            const iconRef = useRef(null);
            useEffect(() => {
                if (iconRef.current) {
                    lucide.createIcons({
                        root: iconRef.current.parentNode
                    });
                }
            }, [name]);
            return <i data-lucide={name} ref={iconRef} className={className} style={{ width: `${size}px`, height: `${size}px`, fill: fill }}></i>;
        };

        const FALLBACK_WORDS = [
            "MAMMA", "PAPA", "NONNO", "NONNA", "CANE", "GATTO", "SOLE", "MARE", 
            "CASA", "PALLA", "LIBRO", "FIORE", "PANE", "LATTE", "MELA", "NIDO",
            "RANA", "LUNA", "LUCE", "ORSO", "UVA", "VINO", "ERBA", "TRENO",
            "FRUTTA", "SCUOLA", "GIOCO"
        ];

        const App = () => {
            const [words, setWords] = useState([]);
            const [loading, setLoading] = useState(true);
            const [currentWord, setCurrentWord] = useState('');
            const [grid, setGrid] = useState([]);
            const [isUppercase, setIsUppercase] = useState(true);
            const [found, setFound] = useState(false);
            const [gameStarted, setGameStarted] = useState(false);
            const [correctCoords, setCorrectCoords] = useState([]);
            const [feedbackMap, setFeedbackMap] = useState({}); 
            const [foundCount, setFoundCount] = useState(0);
            const [totalSolved, setTotalSolved] = useState(0);
            const [showReward, setShowReward] = useState(false);
            const [chestState, setChestState] = useState('closed'); // 'closed', 'shaking', 'ready_to_open', 'open'
            const [selectedVideo, setSelectedVideo] = useState('');
            
            // --- STATI DELLA MODALITÀ BOSS ---
            const [isBossMode, setIsBossMode] = useState(false);
            const [bossHp, setBossHp] = useState(BOSS_MAX_HP);
            const [bossTimeLeft, setBossTimeLeft] = useState(BOSS_TIME_LIMIT);
            const [bossTargetWord, setBossTargetWord] = useState('');
            const [bossOptions, setBossOptions] = useState([]);
            const [bossEffect, setBossEffect] = useState(null); // 'hit', 'miss', null
            const [bossEndState, setBossEndState] = useState(null); // 'won', 'lost', null
            const [isBossLocked, setIsBossLocked] = useState(false);

            const [debugLogs, setDebugLogs] = useState([]);
            const [isConsoleOpen, setIsConsoleOpen] = useState(true);

            const speechIntervalRef = useRef(null);
            const bossSpeechIntervalRef = useRef(null);
            const bossTimerRef = useRef(null);
            const audioCtxRef = useRef(null);
            const bgMusicRef = useRef(null);
            const bossMusicRef = useRef(null);
            const videoRef = useRef(null);

            const addLog = useCallback((msg, type = "info") => {
                const timestamp = new Date().toLocaleTimeString();
                setDebugLogs(prev => [{ timestamp, msg, type }, ...prev].slice(0, 100));
                console.log(`[GameDebug] [${type.toUpperCase()}] ${msg}`);
            }, []);

            useEffect(() => {
                const handleError = (event) => {
                    addLog(`Errore di runtime: ${event.message} in ${event.filename}:${event.lineno}`, "error");
                };
                window.addEventListener('error', handleError);
                return () => window.removeEventListener('error', handleError);
            }, [addLog]);

            // Inizializzazione audio di sottofondo
            useEffect(() => {
                bgMusicRef.current = new Audio('audio/background_music.mp3');
                bgMusicRef.current.loop = true;
                bgMusicRef.current.volume = AUDIO_CONFIG.bgMusicVolume;

                bossMusicRef.current = new Audio('audio/boss_music.mp3');
                bossMusicRef.current.loop = true;
                bossMusicRef.current.volume = AUDIO_CONFIG.bossMusicVolume;

                addLog("File audio di sottofondo caricati.");

                return () => {
                    if (bgMusicRef.current) bgMusicRef.current.pause();
                    if (bossMusicRef.current) bossMusicRef.current.pause();
                };
            }, [addLog]);

            // Caricamento elenco parole
            useEffect(() => {
                const loadWords = async () => {
                    try {
                        const response = await fetch('assets/words.txt');
                        if (!response.ok) throw new Error(`HTTP ${response.status}`);
                        const text = await response.text();
                        const list = text.split(/\r?\n/)
                            .map(w => w.trim().toUpperCase())
                            .filter(w => w.length >= 3 && w.length <= GRID_SIZE);
                        
                        if (list.length > 0) {
                            setWords(list);
                        } else {
                            throw new Error("Nessuna parola idonea trovata nel file txt.");
                        }
                    } catch (err) {
                        setWords(FALLBACK_WORDS);
                    } finally {
                        setLoading(false);
                    }
                };
                loadWords();
            }, [addLog]);

            // Gestione video a tutto schermo
            useEffect(() => {
                if (videoRef.current && showReward && chestState === 'open' && selectedVideo) {
                    addLog(`Inizializzazione riproduzione video: ${selectedVideo}`);
                    videoRef.current.volume = AUDIO_CONFIG.videoVolume;
                    
                    try {
                        videoRef.current.load();
                        const playPromise = videoRef.current.play();
                        if (playPromise !== undefined) {
                            playPromise
                                .then(() => addLog("Riproduzione video avviata con successo.", "success"))
                                .catch(error => {
                                    addLog(`Play bloccato: ${error.message}. Tento riproduzione mutata...`, "warning");
                                    if (videoRef.current) {
                                        videoRef.current.muted = true;
                                        videoRef.current.play()
                                            .then(() => addLog("Riproduzione forzata avviata.", "success"))
                                            .catch(err => addLog(`Play fallito: ${err.message}`, "error"));
                                    }
                                });
                        }
                    } catch (e) {
                        addLog(`Errore setup video: ${e.message}`, "error");
                    }
                }
            }, [showReward, chestState, selectedVideo, addLog]);

            const playTone = (freq, type = 'sine', duration = 0.1, volume = AUDIO_CONFIG.toneVolume) => {
                try {
                    if (!audioCtxRef.current) {
                        audioCtxRef.current = new (window.AudioContext || window.webkitAudioContext)();
                    }
                    const ctx = audioCtxRef.current;
                    if (ctx.state === 'suspended') ctx.resume();
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, ctx.currentTime);
                    gain.gain.setValueAtTime(volume, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + duration);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + duration);
                } catch (e) {}
            };

            const playAudioFile = (path, volume = 0.5) => {
                try {
                    const sound = new Audio(path);
                    sound.volume = volume;
                    sound.play().catch(e => addLog(`Errore riproduzione ${path}: ${e.message}`, "warning"));
                } catch (e) {
                    addLog(`Eccezione audio per ${path}: ${e.message}`, "error");
                }
            };

            const playRewardSound = () => {
                const tones = [523.25, 659.25, 783.99, 1046.50];
                tones.forEach((t, i) => {
                    setTimeout(() => playTone(t, 'square', 0.4, AUDIO_CONFIG.rewardToneVolume), i * 150);
                });
            };

            // Pronuncia parola con sintesi vocale
            const speakWordText = (wordToSpeak) => {
                if (!wordToSpeak) return;
                try {
                    window.speechSynthesis.cancel();
                    const utterance = new SpeechSynthesisUtterance(wordToSpeak.toLowerCase());
                    utterance.lang = 'it-IT';
                    utterance.rate = AUDIO_CONFIG.speechRate; 
                    utterance.volume = AUDIO_CONFIG.speechVolume;
                    window.speechSynthesis.speak(utterance);
                } catch (e) {}
            };

            const speakWord = useCallback(() => {
                if (!currentWord || found || !gameStarted || showReward || isBossMode) return;
                speakWordText(currentWord);
            }, [currentWord, found, gameStarted, showReward, isBossMode]);

            useEffect(() => {
                if (gameStarted && !found && !showReward && !isBossMode) {
                    speakWord();
                    speechIntervalRef.current = setInterval(speakWord, 4000);
                } else {
                    clearInterval(speechIntervalRef.current);
                }
                return () => clearInterval(speechIntervalRef.current);
            }, [gameStarted, found, speakWord, showReward, isBossMode]);

            // ==========================================
            //
